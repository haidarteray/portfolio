<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haidar - Contact</title>
    <meta name="description"
        content="Formulaire de contact pour envoyer un message à Haidar, étudiant en BTS SIO SLAM.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <main class="main">
        <div class="contact__container">
            <!-- Back to Portfolio Button -->
            <a href="../index.html" class="contact__back-btn">
                <i class="fa-solid fa-arrow-left"></i> Retour au Portfolio
            </a>

            <!-- Contact Form Card -->
            <div class="contact__card">
                <h1 class="contact__title">Me Contacter</h1>
                <span class="contact__subtitle">Envoyez-moi un message</span>

                <form action="https://api.web3forms.com/submit" method="POST" class="contact__form">
                    <input type="hidden" name="access_key" value="306fbfc2-e38f-4d90-86c4-a32ae93923df">
                    <div class="contact__group">
                        <label for="name" class="contact__label">Nom / Entreprise</label>
                        <input type="text" id="name" name="name" class="contact__input"
                            placeholder="Votre nom ou société" required>
                    </div>

                    <div class="contact__group">
                        <label for="email" class="contact__label">Adresse E-mail</label>
                        <input type="email" id="email" name="email" class="contact__input" placeholder="vous@email.com"
                            required>
                    </div>

                    <div class="contact__group">
                        <label for="subject" class="contact__label">Objet</label>
                        <input type="text" id="subject" name="subject" class="contact__input"
                            placeholder="Sujet de votre message" required>
                    </div>

                    <div class="contact__group">
                        <label for="message" class="contact__label">Message</label>
                        <textarea id="message" name="message" class="contact__textarea" placeholder="Votre message..."
                            required></textarea>
                    </div>

                    <button type="submit" class="btn btn--tertiary">
                        Envoyer le message <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>

            <div class="contact__socials">
                <a href="https://github.com/haidarteray" target="_blank" class="contact__social-link">
                    <i class="fa-brands fa-github"></i> GitHub
                </a>
                <a href="https://www.linkedin.com/in/haidar-teray-b484b1370" target="_blank"
                    class="contact__social-link">
                    <i class="fa-brands fa-linkedin"></i> LinkedIn
                </a>
            </div>
        </div>
    </main>


</body>

</html>
